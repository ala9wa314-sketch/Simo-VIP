name: Build Simo VIP APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle
      run: |
        sudo apt update
        sudo apt install -y gradle

    - name: Build APK
      run: |
        # البحث عن مجلد المشروع المشتمل على ملف البناء وتشغيل التجميع منه
        BUILD_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
        if [ -n "$BUILD_DIR" ]; then
          cd "$BUILD_DIR"
        fi
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SimoVIP-APK
        path: "**/build/outputs/apk/debug/*.apk"
