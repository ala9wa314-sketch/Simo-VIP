name: Build Simo VIP APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Locate Project & Auto-Fix Gradle Wrapper
      run: |
        # البحث عن المجلد الذي يحتوي على build.gradle أو AndroidManifest.xml
        PROJECT_DIR=$(find . -maxdepth 3 -name "build.gradle" -o -name "AndroidManifest.xml" | head -n 1 | xargs dirname)
        
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        
        echo "Project directory found at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # إنشاء Gradle Wrapper إذا لم يكن موجوداً
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build APK
      run: |
        # التجميع من الجذر أو المجلد الفرعي تلقائياً
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          find . -name "gradlew" -exec {} assembleDebug --stacktrace \; || gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SimoVIP-APK
        path: "**/build/outputs/apk/debug/*.apk"
